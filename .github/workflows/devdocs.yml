name: DevDocs

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      godot_version:
        description: 'Godot version'
        default: '4.6'
        required: true

env:
  godot_version: ${{ github.event.inputs.godot_version || '4.6' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v6

    - name: Clone devdocs
      run: git clone --depth 1 https://github.com/freeCodeCamp/devdocs.git

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '4.0.5'
        bundler-cache: true
        working-directory: ./devdocs

    - name: Patch godot scraper for ${{ env.godot_version }}
      run: |
        ruby scripts/patch-godot-scraper.rb devdocs ${{ env.godot_version }}
        grep -A 6 "version '${{ env.godot_version }}'" devdocs/lib/docs/scrapers/godot.rb

    - name: Verify setup
      run: |
        echo "=== Patched scraper file (first look) ==="
        grep -B 2 -A 6 "version '${{ env.godot_version }}'" devdocs/lib/docs/scrapers/godot.rb
        echo "=== Test fetching godot 4.6 docs ==="
        curl -sI "https://docs.godotengine.org/en/4.6/classes/index.html" | head -5

    - name: Generate Godot ${{ env.godot_version }} devdocs
      run: cd devdocs && bundle exec thor docs:generate godot@${{ env.godot_version }} --force
      timeout-minutes: 30

    - name: Package
      run: |
        godot_v=${{ env.godot_version }}
        mv "devdocs/public/docs/godot~${godot_v}/" "godot~${godot_v}/"
        tar czf "godot-${godot_v}-devdocs.tar.gz" "godot~${godot_v}/"

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        GODOT_VERSION="${{ env.godot_version }}"
        TAG="devdocs-${GODOT_VERSION}"
        gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
        gh release create "$TAG" \
          "godot-${GODOT_VERSION}-devdocs.tar.gz" \
          --title "DevDocs ${GODOT_VERSION}" \
          --notes "Godot ${GODOT_VERSION} documentation in devdocs format"
